<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profilim | GAMEHUB</title><link rel="stylesheet" href="style.css"></head><body><div id="headerMount"></div><script src="site.js"></script><script>document.getElementById('headerMount').outerHTML=header()</script><main class="standard-page"><section class="content-panel"><span class="section-kicker">OYUNCU ALANI</span><h1>Profilim</h1><div id="profileContent"><p>Profil yükleniyor...</p></div><form id="profileForm" hidden><label>Kullanıcı adı<input name="username" required minlength="3" maxlength="24"></label><label>E-posta adresi<input name="email" type="email" disabled></label><button class="gradient-btn">Profili kaydet</button><p class="form-message" aria-live="polite"></p></form><p><a class="gradient-btn" href="favoriler.html">Favori oyunlarım</a></p></section><script>(async()=>{try{const {user}=await api('/api/me');if(!user){location.href='giris.html';return}const f=document.getElementById('profileForm');f.hidden=false;f.username.value=user.username;f.email.value=user.email;document.getElementById('profileContent').innerHTML='<p>Üyelik tarihi: '+esc(new Date(user.createdAt).toLocaleDateString('tr-TR'))+'</p>';f.addEventListener('submit',async e=>{e.preventDefault();const m=f.querySelector('.form-message');try{const r=await api('/api/profile',{method:'PATCH',body:JSON.stringify({username:f.username.value})});m.textContent='Profilin kaydedildi.';f.username.value=r.user.username;updateHeader()}catch(x){m.textContent=x.message}})}catch(e){document.getElementById('profileContent').textContent=e.message}})()</script></main><div id="footerMount"></div><script>document.getElementById('footerMount').outerHTML=footer()</script></body></html>

<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giriş Yap | GAMEHUB</title><link rel="stylesheet" href="style.css"></head><body><div id="headerMount"></div><script src="site.js"></script><script>document.getElementById('headerMount').outerHTML=header()</script><main class="standard-page"><section class="auth-card"><span class="section-kicker">YENİDEN HOŞ GELDİN</span><h1>Giriş <span class="gradient-text">yap</span></h1><p>Favorilerine ve profiline kaldığın yerden ulaş.</p><form id="loginForm"><label>E-posta adresi<input name="email" type="email" autocomplete="email" required maxlength="254" placeholder="ornek@eposta.com"></label><label>Parola<input name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128" placeholder="Parolan"></label><button class="gradient-btn" type="submit">Giriş Yap</button><p class="form-message" aria-live="polite"></p></form><p>Henüz hesabın yok mu? <a class="text-link" href="kayit.html">Üye ol</a></p></section><script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,m=f.querySelector('.form-message');m.textContent='Giriş yapılıyor...';try{await api('/api/login',{method:'POST',body:JSON.stringify({email:f.email.value,password:f.password.value})});location.href='profil.html'}catch(x){m.textContent=x.message}})</script></main><div id="footerMount"></div><script>document.getElementById('footerMount').outerHTML=footer()</script></body></html>

<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>İletişim | GAMEHUB</title><link rel="stylesheet" href="style.css"></head><body><div id="headerMount"></div><script src="site.js"></script><script>document.getElementById('headerMount').outerHTML=header()</script><main class="standard-page"><section class="content-panel"><span class="section-kicker">BİZE ULAŞ</span><h1>İletişim</h1><p>Öneri, hata bildirimi veya içerik düzeltme isteğin için aşağıdaki formu kullanabilirsin. Form, sunucuya e-posta gönderimi bağlanana kadar mesajını yalnızca bu cihazda hazırlamaz; gönderim işlevi için yayın öncesi e-posta hizmeti ayarlanmalıdır.</p><form id="contactForm"><label>Adın<input name="name" required maxlength="80"></label><label>E-posta adresin<input name="email" type="email" required maxlength="254"></label><label>Mesajın<textarea name="message" required maxlength="3000" rows="5"></textarea></label><button class="gradient-btn" type="submit">Mesajı hazırla</button><p class="form-message" aria-live="polite"></p></form></section><script>document.getElementById('contactForm').addEventListener('submit',e=>{e.preventDefault();const f=e.currentTarget;const subject=encodeURIComponent('GAMEHUB iletişim: '+f.name.value);const body=encodeURIComponent('Gönderen: '+f.name.value+' ('+f.email.value+')

'+f.message.value);location.href='mailto:iletisim@example.com?subject='+subject+'&body='+body;f.querySelector('.form-message').textContent='E-posta uygulaman açılacak. Yayına almadan önce iletisim@example.com adresini kendi adresinle değiştir.'})</script></main><div id="footerMount"></div><script>document.getElementById('footerMount').outerHTML=footer()</script></body></html>

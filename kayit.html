<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Üye Ol | GAMEHUB</title><link rel="stylesheet" href="style.css"></head><body><div id="headerMount"></div><script src="site.js"></script><script>document.getElementById('headerMount').outerHTML=header()</script><main class="standard-page"><section class="auth-card"><span class="section-kicker">MACERAYA KATIL</span><h1>Hesap <span class="gradient-text">oluştur</span></h1><p>Favori oyunlarını kaydetmek için ücretsiz üye ol.</p><form id="registerForm"><label>Kullanıcı adı<input name="username" autocomplete="username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_ğüşöçıİĞÜŞÖÇ-]+" placeholder="OyuncuAdı"></label><label>E-posta adresi<input name="email" type="email" autocomplete="email" required maxlength="254" placeholder="ornek@eposta.com"></label><label>Parola<input name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="128" placeholder="En az 10 karakter"></label><label>Parolayı tekrar yaz<input name="confirm" type="password" autocomplete="new-password" required minlength="10" maxlength="128" placeholder="Aynı parolayı tekrar yaz"></label><p class="form-note">Hesap oluşturarak <a class="text-link" href="kosullar.html">Kullanım Koşulları</a> ve <a class="text-link" href="gizlilik.html">Gizlilik Açıklaması</a> hakkında bilgi sahibi olduğunu onaylarsın.</p><button class="gradient-btn" type="submit">Hesabımı oluştur</button><p class="form-message" aria-live="polite"></p></form><p>Zaten üye misin? <a class="text-link" href="giris.html">Giriş yap</a></p></section><script>document.getElementById('registerForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,m=f.querySelector('.form-message');if(f.password.value!==f.confirm.value){m.textContent='Parolalar eşleşmiyor.';return}m.textContent='Hesap oluşturuluyor...';try{await api('/api/register',{method:'POST',body:JSON.stringify({username:f.username.value,email:f.email.value,password:f.password.value})});location.href='profil.html'}catch(x){m.textContent=x.message}})</script></main><div id="footerMount"></div><script>document.getElementById('footerMount').outerHTML=footer()</script></body></html>
